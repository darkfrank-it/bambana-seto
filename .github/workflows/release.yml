name: Release

on:
  push:
    tags:
      - "*.*.*"
  # Avvio manuale da Actions > Release > Run workflow, scegliendo un tag esistente
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Solo su un tag: lanciato su un branch creerebbe una release col nome del branch
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: |
          $dest = "bambana-seto-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path target/release/bambana-seto.exe -DestinationPath $dest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bambana-seto-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
